name: Daily Translate

on:
  schedule:
    # 00:00 UTC = 09:00 JST. The source forums are low-volume, so daily is enough.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max number of new posts to translate per source this run"
        required: false
        default: ""
      source:
        description: "Restrict to one source id (e.g. ethresear or magicians). Empty = all."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install pipeline deps
        run: npm ci

      - name: Expand glossary
        run: npm run expand-glossary

      - name: Fetch + translate new posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.source }}"
          fi
          node --import tsx scripts/fetch-and-translate.ts $ARGS

      - name: Open PR if there are changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only stage generated/tracked content, never anything else (no `git add -A`).
          git -c user.name="ethresear-jp-bot" \
              -c user.email="187392377+ethresear-jp-bot@users.noreply.github.com" \
              add content/posts content/glossary scripts/state.json glossary.md

          if git diff --cached --quiet; then
            echo "No new content to commit. Exiting."
            exit 0
          fi

          BR="auto/translate-$(date -u +%F)"
          git checkout -b "$BR"
          git -c user.name="ethresear-jp-bot" \
              -c user.email="187392377+ethresear-jp-bot@users.noreply.github.com" \
              commit -m "feat: translate new forum posts ($(date -u +%F))"

          git push -u origin "$BR"

          COUNT=$(git diff --name-only main...HEAD -- content/posts | wc -l)
          # No --assignee: the default GITHUB_TOKEN is a GitHub App installation
          # token, which cannot assign users (replaceActorsForAssignable fails).
          # Under `bash -e` that error aborts the step.
          gh pr create \
            --title "Daily translation $(date -u +%F) (${COUNT} new posts)" \
            --body "Automated translation by Gemini 2.5 Pro. Auto-merged to deploy via Cloudflare Pages."

          # Merge immediately rather than `--auto`: main has no required status
          # checks, so the PR is CLEAN at creation and enablePullRequestAutoMerge
          # rejects it ("Pull request is in clean status"), failing the step.
          gh pr merge --merge --delete-branch "$BR"
